name: update hevy stats

on:
  schedule:
    - cron: "17 13 * * *"   # every day around 6am pacific
  workflow_dispatch:         # lets you run it by hand from the actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pull stats from hevy
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/update_hevy.py

      - name: save hevy.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hevy.json
          git diff --cached --quiet || (git commit -m "update hevy stats" && git push)
